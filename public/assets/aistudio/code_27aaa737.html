<body class="bg-light-surface text-light-on-surface antialiased">
  <div class="min-h-[884px] flex flex-col max-w-md mx-auto bg-light-surface" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Header Resmi Instansi -->
    <header class="bg-light-primary-container text-light-on-primary-container sticky top-0 z-20 border-b border-light-primary">
      <div class="px-gutter-lg pt-gutter-lg pb-gutter-md flex items-center gap-gutter-md">
        <div class="w-10 h-10 rounded bg-light-surface-container-lowest text-light-primary flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-headline-md" aria-hidden="true">account_balance</span>
        </div>
        <div class="min-w-0 flex-1">
          <p data-design-text-token="label-sm" class="font-label text-label-sm text-light-inverse-primary">Pemerintah Daerah</p>
          <h1 data-design-text-token="title-md" class="font-headline text-title-md text-light-on-primary-container text-balance">Dinas Komunikasi dan Informatika</h1>
        </div>
      </div>

      <!-- Navigasi Utama -->
      <nav aria-label="Navigasi utama" class="px-gutter-lg grid grid-cols-2 gap-gutter-sm pb-gutter-md">
        <a href="../formulir-buku-tamu/FormulirBukuTamu.html" aria-current="page" class="flex items-center justify-center gap-gutter-xs py-gutter-sm px-gutter-md rounded bg-light-surface-container-lowest text-light-primary font-label text-label-md">
          <span class="material-symbols-outlined text-title-md" aria-hidden="true">edit_document</span>
          <span data-design-text-token="label-md">Buku Tamu</span>
        </a>
        <a href="../dashboard-petugas/DashboardPetugas.html" class="flex items-center justify-center gap-gutter-xs py-gutter-sm px-gutter-md rounded border border-light-outline text-light-on-primary-container font-label text-label-md hover:bg-light-primary transition-colors duration-state-change ease-state-change">
          <span class="material-symbols-outlined text-title-md" aria-hidden="true">dashboard</span>
          <span data-design-text-token="label-md">Dashboard Petugas</span>
        </a>
      </nav>
    </header>

    <!-- Konten Utama -->
    <main class="flex-1 px-gutter-lg py-gutter-xl flex flex-col gap-gutter-lg">
      <section class="flex flex-col gap-gutter-xs">
        <h2 data-design-text-token="headline-lg-mobile" class="font-headline text-headline-lg-mobile text-light-primary text-balance">Pendaftaran Tamu</h2>
        <p data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant text-pretty">
          Silakan lengkapi data kunjungan Anda untuk mendapatkan nomor antrean dan tanda masuk resmi.
        </p>
      </section>

      <!-- Kartu Formulir Buku Tamu -->
      <article data-component-id="card-outlined" data-component-type="card" data-component-variant="outlined" class="rounded-md border border-light-outline-variant bg-light-surface-container-lowest p-gutter-lg flex flex-col gap-gutter-lg">
        <form action="../bukti-kunjungan/BuktiKunjungan.html" class="flex flex-col gap-gutter-lg">

          <!-- Nama Lengkap -->
          <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-gutter-xs w-full">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Nama Lengkap</span>
            <input type="text" name="nama" required placeholder="Contoh: Budi Santoso, S.Kom." aria-describedby="nama-hint" class="w-full min-h-11 px-gutter-md py-gutter-sm rounded border border-light-outline-variant bg-light-surface-container-lowest font-body text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:ring-1 focus:ring-light-primary transition-colors duration-state-change ease-state-change">
            <span id="nama-hint" data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">Sesuai KTP atau kartu identitas resmi.</span>
          </label>

          <!-- Instansi -->
          <label data-component-id="input-field-text-compact" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-gutter-xs w-full">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Instansi / Asal Lembaga</span>
            <input type="text" name="instansi" required placeholder="Contoh: PT Nusantara Sistem / Masyarakat Umum" class="w-full min-h-11 px-gutter-md py-gutter-sm rounded border border-light-outline-variant bg-light-surface-container-lowest font-body text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:ring-1 focus:ring-light-primary transition-colors duration-state-change ease-state-change">
          </label>

          <!-- Nomor HP -->
          <label data-component-id="input-field-icon" data-component-type="input-field" data-component-variant="with-icon" class="flex flex-col gap-gutter-xs w-full">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Nomor HP / WhatsApp</span>
            <div class="relative flex items-center">
              <span aria-hidden="true" class="material-symbols-outlined text-title-md text-light-on-surface-variant absolute left-gutter-md pointer-events-none">call</span>
              <input type="tel" name="nomor_hp" inputmode="numeric" required placeholder="0812-3456-7890" class="w-full min-h-11 pl-10 pr-gutter-md py-gutter-sm rounded border border-light-outline-variant bg-light-surface-container-lowest font-body text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:ring-1 focus:ring-light-primary transition-colors duration-state-change ease-state-change">
            </div>
          </label>

          <!-- Unit Tujuan -->
          <label data-component-id="input-field-select" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-gutter-xs w-full">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Unit Tujuan</span>
            <select name="unit_tujuan" required class="w-full min-h-11 px-gutter-md py-gutter-sm rounded border border-light-outline-variant bg-light-surface-container-lowest font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary transition-colors duration-state-change ease-state-change">
              <option value disabled selected>Pilih unit atau bidang tujuan</option>
              <option value="layanan-publik">Bidang Layanan Informasi Publik</option>
              <option value="aplikasi">Bidang Aplikasi Informatika</option>
              <option value="sekretariat">Sekretariat</option>
              <option value="keamanan-siber">Bidang Persandian &amp; Keamanan Siber</option>
              <option value="umum">Bagian Umum &amp; Kepegawaian</option>
            </select>
          </label>

          <!-- Keperluan -->
          <label data-component-id="input-field-textarea" data-component-type="input-field" data-component-variant="text" class="flex flex-col gap-gutter-xs w-full">
            <span data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Keperluan Kunjungan</span>
            <textarea name="keperluan" rows="3" required placeholder="Tuliskan maksud kunjungan Anda secara singkat dan jelas" class="w-full px-gutter-md py-gutter-sm rounded border border-light-outline-variant bg-light-surface-container-lowest font-body text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:ring-1 focus:ring-light-primary transition-colors duration-state-change ease-state-change"></textarea>
          </label>

          <!-- Tombol Kirim -->
          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center gap-gutter-sm min-h-12 px-gutter-xl py-gutter-md rounded bg-light-primary text-light-on-primary font-label hover:bg-light-primary-container active:scale-[0.99] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary transition-colors duration-state-change ease-state-change">
            <span data-design-text-token="label-lg" class="font-label text-label-lg">Kirim</span>
          </button>

        </form>
      </article>
    </main>

    <!-- Footer -->
    <footer class="px-gutter-lg py-gutter-lg border-t border-light-outline-variant bg-light-surface-container-low text-center">
      <p data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">
        Layanan Buku Tamu Digital · Dinas Komunikasi dan Informatika
      </p>
    </footer>

  </div>


</body></html>
